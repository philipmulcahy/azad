name: Build FSA/HSA test extension

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fsa-hsa-support

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm run test_jest -- --runInBand

      - name: Build extension (includes TypeScript lint)
        run: npm run build

      - name: Upload test extension
        uses: actions/upload-artifact@v4
        with:
          name: azad-fsa-hsa-test-extension
          path: build/
          if-no-files-found: error

<!doctype html>
<!--
Anonymized excerpt of a real amazon.com order details page (2026-11),
order paid partly by Amazon Gift Card and partly by Visa.
Only the payment method widget and order summary are kept; scripts,
styles, images, ids and urls were stripped. Card digits and amounts are
fake but internally consistent: 20.00 + 1.50 tax - 15.00 gift = 6.50.
-->
<html lang="en-us"><body>
<div data-component="viewPaymentPlanSummaryWidget">
<h5 class="a-spacing-micro">Payment method</h5>
<div class="a-section">
<div>
<div>
<div aria-label="payment method list">
<div>
<div>
<div aria-label="payment method">
<div data-testid="payment-instrument">
<div>
<div data-testid="payment-instrument-focusable-ref">
<div data-testid="payment-instrument-text-wrapper">
<span data-testid="payment-instrument-message">Visa •••• 1234</span>
</div>
</div>
</div>
</div>
</div>
</div>
<div>
<div aria-label="payment method">
<div data-testid="payment-instrument">
<div>
<div data-testid="payment-instrument-focusable-ref">
<div data-testid="payment-instrument-text-wrapper">
<span data-testid="payment-instrument-message">Amazon Gift Card</span>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<div data-testid="viewTransactionsButton">
<button aria-label="View related transactions" role="button">
<div>
<div data-testid="text">View related transactions</div>
</div>
</button>
</div>
</div>
</div>
</div>
</div>
<div data-component="chargeSummary">
<div class="a-column a-span12">
<div class="a-row a-spacing-small">
<h5>Order Summary</h5>
</div>
<ul class="a-unordered-list a-nostyle a-vertical">
<li>
<span class="a-list-item">
<div class="a-row od-line-item-row">
<div class="a-column a-span7 od-line-item-row-label">
<span class="a-size-base">
<span>Item(s) Subtotal:</span>
</span>
</div>
<div class="a-column a-span5 od-line-item-row-content a-span-last">
<span class="a-size-base a-color-base">$20.00</span>
</div>
</div>
</span>
</li>
<li>
<span class="a-list-item">
<div class="a-row od-line-item-row">
<div class="a-column a-span7 od-line-item-row-label">
<span class="a-size-base">
<span>Shipping &amp; Handling:</span>
</span>
</div>
<div class="a-column a-span5 od-line-item-row-content a-span-last">
<span class="a-size-base a-color-base">$0.00</span>
</div>
</div>
</span>
</li>
<li>
<span class="a-list-item">
<div class="a-row od-line-item-row">
<div class="a-column a-span7 od-line-item-row-label">
<span class="a-size-base">
<span>Total before tax:</span>
</span>
</div>
<div class="a-column a-span5 od-line-item-row-content a-span-last">
<span class="a-size-base a-color-base">$20.00</span>
</div>
</div>
</span>
</li>
<li>
<span class="a-list-item">
<div class="a-row od-line-item-row">
<div class="a-column a-span7 od-line-item-row-label">
<span class="a-size-base">
<span>Estimated tax to be collected:</span>
</span>
</div>
<div class="a-column a-span5 od-line-item-row-content a-span-last">
<span class="a-size-base a-color-base">$1.50</span>
</div>
</div>
</span>
</li>
<li>
<span class="a-list-item">
<div class="a-row od-line-item-row">
<div class="a-column a-span7 od-line-item-row-label">
<span class="a-size-base">
<span>Gift Card Amount:</span>
</span>
</div>
<div class="a-column a-span5 od-line-item-row-content a-span-last">
<span class="a-size-base a-color-base">-$15.00</span>
</div>
</div>
</span>
</li>
<li>
<span class="a-list-item">
<div class="a-row od-line-item-row">
<div class="a-column a-span7 od-line-item-row-label">
<span class="a-size-base a-color-base a-text-bold">
<span>Grand Total:</span>
</span>
</div>
<div class="a-column a-span5 od-line-item-row-content a-span-last">
<span class="a-size-base a-color-base a-text-bold">$6.50</span>
</div>
</div>
</span>
</li>
</ul>
</div>
</div>
</body></html>
